<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page settings -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard</title>

  <!-- Connect our stylesheet (the "paint and furniture") -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="dashboard">

    <!-- ===== Widget 1: Greeting + Clock + Daily quote ===== -->
    <section class="card greeting-card">
      <h1 id="greeting">Hello!</h1>
      <p id="clock" class="clock">--:--:--</p>
      <p id="date" class="date"></p>

      <blockquote class="quote">
        <p id="quote-text"></p>
        <footer id="quote-author"></footer>
      </blockquote>
    </section>

    <!-- ===== Widget 2: Weather ===== -->
    <section class="card">
      <h2>🌦️ Weather</h2>

      <form id="weather-form" class="row-form">
        <input id="weather-input" type="text" placeholder="Enter your city" autocomplete="off">
        <button type="submit">Show</button>
      </form>

      <!-- script.js fills this in -->
      <div id="weather-result" class="weather-result">
        <p class="empty-message">Type a city to see the weather.</p>
      </div>
    </section>

    <!-- ===== Widget 3: To-do list ===== -->
    <section class="card">
      <h2>✅ To-do</h2>

      <form id="todo-form" class="row-form">
        <input id="todo-input" type="text" placeholder="What do you need to do?" autocomplete="off">
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="item-list"></ul>
      <p id="todo-empty" class="empty-message">No tasks yet. Add one above!</p>
    </section>

    <!-- ===== Widget 4: Habit tracker ===== -->
    <section class="card">
      <h2>🔥 Habits</h2>

      <form id="habit-form" class="row-form">
        <input id="habit-input" type="text" placeholder="e.g. Drink water, Read 10 pages" autocomplete="off">
        <button type="submit">Add</button>
      </form>

      <ul id="habit-list" class="item-list"></ul>
      <p id="habit-empty" class="empty-message">No habits yet. Add one to start a streak!</p>
    </section>

    <!-- ===== Widget 5: Quick notes ===== -->
    <section class="card">
      <h2>📝 Notes</h2>
      <textarea id="notes" class="notes" placeholder="Write anything here… it saves automatically."></textarea>
      <p id="notes-status" class="small-text"></p>
    </section>

    <!-- ===== Widget 6: Favorite links ===== -->
    <section class="card">
      <h2>🔗 Favorite links</h2>

      <form id="link-form" class="link-form">
        <input id="link-name" type="text" placeholder="Name (e.g. YouTube)" autocomplete="off">
        <input id="link-url" type="text" placeholder="Address (e.g. youtube.com)" autocomplete="off">
        <button type="submit">Add</button>
      </form>

      <div id="link-list" class="link-list"></div>
      <p id="link-empty" class="empty-message">No links yet.</p>
    </section>

  </main>

  <!-- Connect our JavaScript (the "electricity"), loaded last so the page exists first -->
  <script src="script.js"></script>
</body>
</html>
