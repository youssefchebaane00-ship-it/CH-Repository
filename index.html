<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PersonalDashboard</title>

  <!-- Installable app: name, icons and colors (see manifest.webmanifest and sw.js) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0a1020">

  <!-- Apply the saved theme BEFORE the page is drawn (avoids a white flash). Dark is the default. -->
  <script>
    try {
      const settings = JSON.parse(localStorage.getItem("pd.settings") || "null");
      const oldTheme = JSON.parse(localStorage.getItem("theme") || "null"); // from version 1
      document.documentElement.dataset.theme = (settings && settings.theme) || oldTheme || "dark";
      document.documentElement.dataset.accent = (settings && settings.accent) || "cyan";
    } catch {}
  </script>

  <!-- Inter font (falls back to the system font when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/study.css">
  <link rel="stylesheet" href="css/personal.css">
  <link rel="stylesheet" href="css/analytics.css">
  <link rel="stylesheet" href="css/stage-b.css">
  <link rel="stylesheet" href="css/stage-c.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <div class="app" id="app">

    <!-- ===== Sidebar (filled in by js/shell.js) ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <div class="logo" aria-hidden="true">PD</div>
        <span class="brand-name">PersonalDashboard</span>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <a class="profile" id="profile" href="#/settings"></a>
        <button class="btn-icon collapse-button" id="collapse-button" type="button"></button>
      </div>
    </aside>

    <!-- Dark overlay behind the sidebar on phones -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ===== Main area ===== -->
    <div class="main">

      <header class="topbar">
        <button class="btn-icon menu-button" id="menu-button" type="button" aria-label="Open menu"></button>

        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="topbar-date" class="topbar-date"></p>
        </div>

        <div class="search" id="search">
          <span class="search-icon" id="search-icon"></span>
          <input id="search-input" type="search" placeholder="Search or run a command…  (Ctrl+K)" autocomplete="off"
                 aria-label="Search your data or run a command">
          <div class="dropdown search-results" id="search-results" hidden></div>
        </div>

        <div class="topbar-actions">
          <!-- Shown while a study timer or Pomodoro is running (js/widgets/study.js) -->
          <a class="timer-pill" id="timer-pill" href="#/study" hidden title="Open Study Tracker">
            <span class="pill-dot"></span><span data-pill-text></span>
          </a>
          <div class="quick-add">
            <button class="btn btn-primary" id="quick-add-button" type="button" aria-haspopup="menu" aria-expanded="false"></button>
            <div class="dropdown quick-add-menu" id="quick-add-menu" role="menu" hidden></div>
          </div>
          <div class="notifications">
            <button class="btn-icon bell" id="notifications-button" type="button" aria-haspopup="true" aria-expanded="false"></button>
            <div class="dropdown notifications-panel" id="notifications-panel" hidden></div>
          </div>
          <button class="btn-icon" id="theme-button" type="button"></button>
        </div>
      </header>

      <!-- Each page is drawn in here by js/router.js -->
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Toast notifications appear here -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Scripts: order matters, each file can use the ones loaded before it -->
  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/widgets/welcome.js"></script>
  <script src="js/widgets/stats.js"></script>
  <script src="js/widgets/tasks.js"></script>
  <script src="js/widgets/habits.js"></script>
  <script src="js/widgets/notes.js"></script>
  <script src="js/widgets/links.js"></script>
  <script src="js/widgets/weather.js"></script>
  <script src="js/widgets/calendar.js"></script>
  <script src="js/widgets/pomodoro.js"></script>
  <script src="js/widgets/study.js"></script>
  <script src="js/widgets/projects.js"></script>
  <script src="js/widgets/planner.js"></script>
  <script src="js/widgets/goals.js"></script>
  <script src="js/widgets/expenses.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/widgets/analytics.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/widgets/achievements.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/backups.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/views.js"></script>
  <script src="js/router.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
